<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seminfo 2.0</title>
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
    <header>
        <h1>Seminfo 2.0</h1>
        <p>Semana de informatica 2026</p>

        <nav>
                <b><a href="javascript:mostrarInscricao()">Inscrição</a> 
                <a href="javascript:mostrarParticipantes()">Participantes</a></b>
        </nav>

    </header>
    <main>
        <section class="inscricao" id="inscricao">
        <form id="form-inscricao">
            <h2>Inscrição de Participantes</h2>
            <br>
            <label for="nome">Nome do participante </label>
            <input type="text" id="nome" required>

            <label for="email">Email do participante </label>
            <input type="email" id="email" required>

            <label for="curso">Curso</label>
            <select id="curso" required>
                <option value="" hidden></option>
                <option value="SI"> Sistemas de Informação</option>
                <option value="GTI"> Gestão de TI</option>
                <option value="TADS"> Tecnologia em Análise e Desenvolvimento de Sistemas</option>
            </select>

            <br>
            <button type="submit">Inscrever</button>
        </form>
        <p id="mensagem"></p>
    </section>

    <section class="participantes" id="participante">
        <h2>Participantes Inscritos</h2>
        <p>Total: <span id="total-participantes">0</span></p>
        <ol id="lista-participantes">
            
        </ol>
    </section>
    </main>
    <script src="../js/script.js"></script>
</body>
</html>
